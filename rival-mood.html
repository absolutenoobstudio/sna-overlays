<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
         display: flex; align-items: center; justify-content: center; }

  .panel {
    width: 97%; height: 88%;
    background: linear-gradient(180deg, rgba(18,5,8,.93), rgba(8,3,5,.95));
    border: 1px solid rgba(212,175,55,.5); border-radius: 16px;
    display: flex; align-items: center; gap: 26px; padding: 0 28px;
    box-shadow: 0 8px 26px rgba(0,0,0,.55);
    opacity: 0; transition: opacity .7s;
  }
  .panel.show { opacity: 1; }

  .meter { flex: 1.6; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .meter .top { display: flex; justify-content: space-between; align-items: baseline; }
  .meter .lbl { color: #9c8a95; font-size: 12px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
  .meter .pct { color: #ffd75e; font-size: 20px; font-weight: 900; }
  .track { height: 18px; border-radius: 999px; background: rgba(255,255,255,.10); overflow: hidden; }
  .fill { height: 100%; width: 50%; border-radius: 999px;
          background: linear-gradient(90deg, #ff5a60, #ffd75e 55%, #43c46a);
          transition: width 1.1s cubic-bezier(.4,0,.2,1); }
  .verdict { color: #fff; font-size: 17px; font-weight: 800; letter-spacing: 1px; }

  .divider { width: 1px; height: 58%; background: rgba(212,175,55,.28); }

  .stat { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 108px; }
  .stat .v { color: #fff; font-size: 26px; font-weight: 900; }
  .stat .n { color: #9c8a95; font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }

  .who { display: flex; align-items: center; gap: 12px; min-width: 240px; }
  .who img { width: 42px; height: 42px; object-fit: contain; }
  .who .nm { color: #e8dfd4; font-size: 19px; font-weight: 800; letter-spacing: 1px; line-height: 1.15; }
  .who .sm { color: #9c8a95; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="who"><img id="logo" alt=""><div><div class="nm" id="name">—</div><div class="sm">Today's victim</div></div></div>
    <div class="divider"></div>
    <div class="meter">
      <div class="top"><span class="lbl">Mood meter</span><span class="pct" id="pct">50%</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="verdict" id="verdict">Waiting for a rival to kick off…</div>
    </div>
    <div class="divider"></div>
    <div class="stat"><div class="v" id="poss">–</div><div class="n">Possession</div></div>
    <div class="stat"><div class="v" id="shots">–</div><div class="n">Shots</div></div>
    <div class="stat"><div class="v" id="target">–</div><div class="n">On target</div></div>
    <div class="stat"><div class="v" id="cards">–</div><div class="n">Cards</div></div>
  </div>

<script>
const RIVALS = {
  "360": "Manchester United", "364": "Liverpool", "363": "Chelsea",
  "382": "Manchester City",   "367": "Tottenham Hotspur",
};
const LEAGUES = ["eng.1", "uefa.champions", "uefa.europa", "eng.fa", "eng.league_cup"];
const Q = new URLSearchParams(location.search);
const FORCE_ID = Q.get("id");

async function jget(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }
const $ = id => document.getElementById(id);

function pick(found) {
  if (!found.length) return null;
  const now = Date.now(), FRESH = 36 * 3600 * 1000;
  const st = m => m.ev.status?.type?.state;
  const t = m => new Date(m.ev.date).getTime();
  const live = found.filter(m => st(m) === "in");
  const pre = found.filter(m => st(m) === "pre").sort((a, b) => t(a) - t(b));
  const post = found.filter(m => st(m) === "post" && now - t(m) < FRESH).sort((a, b) => t(b) - t(a));
  for (const g of [live, pre, post]) if (g.length) return g[0];
  return null;
}

async function findRivalMatch() {
  const found = [];
  for (const lg of LEAGUES) {
    try {
      const j = await jget(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard`);
      for (const ev of j.events ?? []) {
        const comp = ev.competitions?.[0];
        const rival = comp?.competitors?.find(c => {
          const id = String(c.team?.id);
          return FORCE_ID ? id === FORCE_ID : RIVALS[id];
        });
        if (rival) found.push({ lg, ev, comp, rival });
      }
    } catch (e) {}
  }
  return pick(found);
}

function statOf(team, names) {
  for (const n of names) {
    const s = (team?.statistics ?? []).find(x => x.name === n);
    if (s) return s.displayValue ?? s.value;
  }
  return null;
}

function verdictFor(state, diff, red) {
  if (state === "pre") return "Not started. Hope builds.";
  if (state === "post") {
    if (diff > 1) return "Thumped. A vintage evening.";
    if (diff === 1) return "Beaten. Lovely stuff.";
    if (diff === 0) return "A draw. Dropped points at least.";
    return "They won. We move on.";
  }
  if (red > 0 && diff >= 0) return "Down to ten and behind. Poetry.";
  if (diff >= 2) return "Getting battered. Glorious.";
  if (diff === 1) return "Losing. Long may it continue.";
  if (diff === 0) return "Level. Someone please score.";
  if (diff === -1) return "Ahead. Not ideal.";
  return "Cruising. Turn it off.";
}

async function tick() {
  let m = null;
  try { m = await findRivalMatch(); } catch (e) {}
  const panel = $("panel");
  panel.classList.add("show");

  if (!m) {
    $("verdict").textContent = "No big-six rival playing right now.";
    $("name").textContent = "—";
    $("logo").removeAttribute("src");
    for (const k of ["poss", "shots", "target", "cards"]) $(k).textContent = "–";
    $("fill").style.width = "50%"; $("pct").textContent = "50%";
    return setTimeout(tick, 60000);
  }

  const rival = m.rival;
  const foe = m.comp.competitors.find(c => c !== rival);
  const rs = parseInt(rival.score ?? "0", 10), fs = parseInt(foe.score ?? "0", 10);
  const state = m.ev.status?.type?.state;

  $("logo").src = rival.team?.logo || "";
  $("name").textContent = rival.team?.displayName || "";

  // detailed numbers live on the summary endpoint
  let tr = null;
  try {
    const j = await jget(`https://site.api.espn.com/apis/site/v2/sports/soccer/${m.lg}/summary?event=${m.ev.id}`);
    tr = (j.boxscore?.teams || []).find(t => String(t.team?.id) === String(rival.team?.id));
  } catch (e) {}

  const poss = statOf(tr, ["possessionPct"]);
  $("poss").textContent = poss ? poss + "%" : "–";
  $("shots").textContent = statOf(tr, ["totalShots"]) ?? "–";
  $("target").textContent = statOf(tr, ["shotsOnTarget"]) ?? "–";
  const yc = parseInt(statOf(tr, ["yellowCards"]) ?? "0", 10);
  const rc = parseInt(statOf(tr, ["redCards"]) ?? "0", 10);
  $("cards").textContent = rc > 0 ? `${yc}Y ${rc}R` : String(yc);

  // how well is it going for us? they lose = 100, they win = 0
  const diff = fs - rs;
  let score = 50 + diff * 22 + rc * 12;
  if (state === "post") score = diff > 0 ? Math.min(100, 80 + diff * 6) : diff === 0 ? 55 : Math.max(0, 25 + diff * 6);
  score = Math.max(0, Math.min(100, Math.round(score)));
  $("fill").style.width = score + "%";
  $("pct").textContent = score + "%";
  $("verdict").textContent = verdictFor(state, diff, rc);

  setTimeout(tick, state === "in" ? 20000 : 60000);
}
tick();
</script>
</body>
</html>
