<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 420px; height: 96px; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }

  .tag {
    position: absolute; left: 0; top: 0;
    display: inline-flex; align-items: center; gap: 14px;
    background: linear-gradient(180deg, rgba(20,6,10,.92), rgba(10,4,6,.92));
    border: 1px solid rgba(212,175,55,.6);
    border-radius: 14px;
    padding: 12px 22px 12px 16px;
    box-shadow: 0 6px 18px rgba(0,0,0,.55);
    animation: slidein .7s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes slidein { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: translateX(0); } }

  .bar {
    width: 7px; height: 44px; border-radius: 4px; flex: none;
    background: linear-gradient(180deg, #ffd75e, #ef0107);
    box-shadow: 0 0 10px rgba(255,215,94,.5);
  }
  .txt { display: flex; flex-direction: column; line-height: 1.12; }
  .name {
    color: #fff; font-size: 32px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase;
    text-shadow: 0 2px 6px rgba(0,0,0,.8);
  }
  .sub {
    color: #d4af37; font-size: 14px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="tag">
    <div class="bar"></div>
    <div class="txt">
      <span class="name" id="n">NAME</span>
      <span class="sub" id="s">SNA FOOTBALL</span>
    </div>
  </div>
<script>
  // usage: nametag.html?name=NOOB&sub=SNA%20FOOTBALL
  const q = new URLSearchParams(location.search);
  document.getElementById("n").textContent = q.get("name") || "NAME";
  const sub = q.get("sub");
  if (sub === "") document.getElementById("s").style.display = "none";
  else document.getElementById("s").textContent = sub || "SNA FOOTBALL";
</script>
<script>
/* ?fit - scale this fixed-size design to fill whatever box the source is given,
   keeping its proportions so nothing is stretched. Without ?fit the page renders
   at its natural size, which is what Streamlabs uses - so adding this changes
   nothing there. TikTok LIVE Studio is portrait-only and its sources are tall
   boxes, which this design would otherwise sit in a corner of. */
(function () {
  if (!new URLSearchParams(location.search).has("fit")) return;
  var DW = 420, DH = 74;
  function fit() {
    var s = Math.min(window.innerWidth / DW, window.innerHeight / DH);
    var b = document.body;
    b.style.width = DW + "px";
    b.style.height = DH + "px";
    b.style.transformOrigin = "top left";
    b.style.transform = "translate(" + ((window.innerWidth - DW * s) / 2) + "px,"
                      + ((window.innerHeight - DH * s) / 2) + "px) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("DOMContentLoaded", fit);
  fit();
})();
</script>
</body>
</html>
