<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; position: relative; }

  /* keep clear of TikTok UI: top ~150px and bottom ~400px are avoided */
  .live-badge {
    position: absolute; top: 190px; left: 44px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(10, 12, 24, .72);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 12px 26px 12px 20px;
    backdrop-filter: blur(8px);
  }
  .live-dot {
    width: 14px; height: 14px; border-radius: 50%; background: #ff3b5c;
    animation: ping 1.6s ease-out infinite;
  }
  @keyframes ping {
    0%   { box-shadow: 0 0 0 0 rgba(255,59,92,.6); }
    100% { box-shadow: 0 0 0 14px rgba(255,59,92,0); }
  }
  .live-badge span { color: #fff; font-weight: 800; font-size: 24px; letter-spacing: 4px; }

  .lower-third {
    position: absolute; left: 44px; bottom: 460px;
    animation: slidein .8s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes slidein {
    from { transform: translateX(-40px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  .name-pill {
    display: inline-flex; align-items: center; gap: 14px;
    background: rgba(10, 12, 24, .72);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px; padding: 16px 28px;
    backdrop-filter: blur(8px);
  }
  .accent-bar {
    width: 7px; height: 40px; border-radius: 4px;
    background: linear-gradient(180deg, #22d3ee, #7c5cff);
  }
  .name-block { display: flex; flex-direction: column; }
  .name { color: #fff; font-size: 30px; font-weight: 800; letter-spacing: 1px; line-height: 1.15; }
  .tagline { color: #9aa3c0; font-size: 18px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="live-badge"><div class="live-dot"></div><span>LIVE</span></div>
  <div class="lower-third">
    <div class="name-pill">
      <div class="accent-bar"></div>
      <div class="name-block">
        <div class="name">AbsoluteNoob</div>
        <div class="tagline">also live on YouTube</div>
      </div>
    </div>
  </div>
</body>
</html>
