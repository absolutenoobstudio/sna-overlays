<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; }

  /* The SNA gaming crest, merged with the VenomousKid / VK1990 badge.
     The gold-neon shield and wordmarks are SNA's; the skull-gamer at the
     centre is lifted straight out of the VK badge so the two identities read
     as one mark. Built as three stacked layers rather than one SVG because
     the skull is a raster - shield behind it, ring and lettering in front. */
  .wrap { position: relative; width: 1024px; height: 1024px; }
  .wrap > * { position: absolute; inset: 0; width: 1024px; height: 1024px; }

  /* The VK badge is 1920x1080 with its dark disc centred at (953,544) r=331.
     Scaled by 196/331 = .5921 the disc lands at r=196 on (512,482), which is
     the clear space inside the shield between the two bands. Clipping to that
     circle drops the white page and the arc text, which is illegible at the
     size this crest actually gets used. */
  .disc {
    inset: auto; left: -52.3px; top: 159.9px;
    width: 1136.8px; height: 639.5px;
    clip-path: circle(190px at 564.3px 322.1px);
  }

  .glow  { filter: url(#neon); }
  .plate { fill: #0a0806; }
  .line  { fill: none; stroke: #ffd75e; stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; }
  .thin  { fill: none; stroke: #d4af37; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
  .ring  { fill: none; stroke: url(#goldv); stroke-width: 10; }
  .band  { fill: #d4af37; }
  .txt   { fill: #fff;    font-family: "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; font-weight: 900; text-anchor: middle; }
  .txtg  { fill: #ffd75e; font-family: "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; font-weight: 900; text-anchor: middle; }
</style>
</head>
<body>
<div class="wrap">

  <!-- behind the skull: the shield body -->
  <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="10" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#ffe9a3"/>
        <stop offset="45%"  stop-color="#ffd75e"/>
        <stop offset="100%" stop-color="#b8892a"/>
      </linearGradient>
      <radialGradient id="pit" cx="50%" cy="42%" r="62%">
        <stop offset="0%"   stop-color="#1c1710"/>
        <stop offset="100%" stop-color="#0a0806"/>
      </radialGradient>
    </defs>

    <path class="plate" fill="url(#pit)"
      d="M512 78 L906 196 L906 566 C906 762 726 872 512 948 C298 872 118 762 118 566 L118 196 Z"/>
    <g class="glow">
      <path class="line"
        d="M512 78 L906 196 L906 566 C906 762 726 872 512 948 C298 872 118 762 118 566 L118 196 Z"/>
      <path class="thin"
        d="M512 126 L862 230 L862 560 C862 730 700 830 512 900 C324 830 162 730 162 560 L162 230 Z"/>
    </g>
    <!-- seat the disc on its own pool of black so the shield texture doesn't
         show through the badge's own dark rim -->
    <circle cx="512" cy="482" r="198" fill="#070605"/>
  </svg>

  <img class="disc" src="vk-logo.png" alt="">

  <!-- in front of the skull: the gold ring and all the lettering -->
  <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <g filter="url(#neon)">
      <circle class="ring" cx="512" cy="482" r="200"/>

      <!-- top: SNA -->
      <path class="band" d="M214 254 H810 V258 H214 Z"/>
      <text class="txt" x="512" y="232" font-size="92" letter-spacing="14">SNA</text>

      <!-- bottom: the club, then the gamertag -->
      <path class="band" d="M232 712 H792 V716 H232 Z"/>
      <text class="txtg" x="512" y="786" font-size="70" letter-spacing="1">NOOBGAMERS</text>
      <text class="txt"  x="512" y="836" font-size="28" letter-spacing="9">VENOMOUSKID</text>

      <!-- a football at the point keeps the SNA half of the badge on the crest -->
      <g class="thin" stroke-width="4">
        <circle cx="512" cy="886" r="27"/>
        <path d="M512 866 l17 12 -6 20 h-22 l-6-20 z"/>
        <path d="M512 866 v-11 M529 878 l10-4 M523 898 l7 10 M501 898 l-7 10 M495 878 l-10-4"/>
      </g>
    </g>
  </svg>

</div>
</body>
</html>
