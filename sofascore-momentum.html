<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Attack Momentum</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }

  /* Sofascore's official Attack Momentum widget, in our card. The widget is
     Sofascore's own iframe - free to embed, fed by their live scout data -
     and it is shown exactly as they serve it, branding included. */
  #card {
    position: absolute; inset: 0; border-radius: 16px; overflow: hidden;
    background: linear-gradient(180deg, rgba(12,22,40,.94), rgba(8,14,27,.94));
    border: 1px solid rgba(93,160,255,.35); box-shadow: 0 10px 40px rgba(0,0,0,.55);
    display: flex; flex-direction: column;
  }
  body.ars #card { background: linear-gradient(180deg, rgba(58,6,12,.95), rgba(26,4,9,.96)); border-color: rgba(239,1,7,.55); }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px 6px; }
  .head .t { color: #fff; font-size: 15px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; }
  .head .t i { font-style: normal; color: #8fc4ff; } body.ars .head .t i { color: #ff4d55; }
  .head .s { color: #8fa3c4; font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  body.ars .head .s { color: #e9b7bb; }
  iframe { flex: 1; width: 100%; border: 0; display: block; background: #171a1e; }
  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
         color: #fff; font-weight: 800; font-size: 16px; line-height: 1.6; padding: 20px; }
  #msg code { color: #ffd75e; }
  body.nomatch #msg { display: flex; } body.nomatch iframe { visibility: hidden; }
</style>
</head>
<body>
<div id="card">
  <div class="head"><div class="t"><i>Attack</i> momentum</div><div class="s" id="sub">live · Sofascore</div></div>
  <iframe id="w" allow="autoplay" referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div id="msg">Paste the Sofascore match link into the address:<br><code>sofascore-momentum.html?url=https://www.sofascore.com/football/match/everton-arsenal/RY#id:16363891</code><br>or just the number: <code>?id=16363891</code></div>
</div>
<script>
/* Usage:
     ?id=16363891                 the Sofascore event id
     ?url=<sofascore match link>  the whole address copied from the browser
                                  (the id is the number after "#id:")
     ?theme=light                 Sofascore's light widget (default dark)
     ?ars                         Arsenal colours on the card (default: on)
     ?neutral                     blue card instead
   The id changes every match: open the match on sofascore.com, copy the
   address, paste it after ?url= . */
const Q = new URLSearchParams(location.search);
let id = Q.get("id") || "";
// a pasted match link ends in "#id:16363891" - the browser keeps that part as
// THIS page's hash, not inside ?url=, so look in both
if (!id) { const m = /id[:=](\d{5,})/.exec(decodeURIComponent((Q.get("url") || "") + " " + location.hash)); if (m) id = m[1]; }
if (!Q.has("neutral")) document.body.classList.add("ars");
if (id) {
  document.getElementById("w").src = `https://widgets.sofascore.com/embed/attackMomentum?id=${encodeURIComponent(id)}&widgetTheme=${Q.get("theme") === "light" ? "light" : "dark"}`;
  document.getElementById("sub").textContent = "live · Sofascore · match " + id;
} else {
  document.body.classList.add("nomatch");
}
</script>
</body>
</html>
