<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }

  /* One camera window, punched clean through with an even-odd path so the hole
     is genuinely transparent (an SVG mask-image masks by ALPHA, not brightness). */
  .art {
    position: absolute; inset: 0;
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='white' fill-rule='evenodd' d='M0 0H1920V1080H0Z M500 280H1420V798H500Z'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1920' height='1080'><path fill='white' fill-rule='evenodd' d='M0 0H1920V1080H0Z M500 280H1420V798H500Z'/></svg>");
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }

  .base {
    position: absolute; inset: 0;
    background:
      radial-gradient(1300px 560px at 50% -8%, rgba(190,20,32,.38), transparent 62%),
      radial-gradient(1000px 460px at 50% 108%, rgba(40,170,90,.16), transparent 60%),
      linear-gradient(180deg, #0d0c10 0%, #14090c 46%, #0a0a0d 100%);
  }

  /* angled crimson wedges either side of the single window */
  .wedge {
    position: absolute; top: 150px; width: 470px; height: 800px; opacity: .5;
    background: linear-gradient(180deg, rgba(176,16,28,.55), rgba(120,8,18,0));
  }
  .wedge.l { left: -70px;  clip-path: polygon(0 0, 100% 12%, 100% 78%, 0 100%); }
  .wedge.r { right: -70px; clip-path: polygon(0 12%, 100% 0, 100% 100%, 0 78%); }

  .hazard {
    position: absolute; top: 0; bottom: 0; width: 66px; opacity: .3;
    background: repeating-linear-gradient(135deg, #c0121f 0 22px, transparent 22px 44px);
    -webkit-mask-image: linear-gradient(180deg, transparent, black 16%, black 84%, transparent);
    mask-image: linear-gradient(180deg, transparent, black 16%, black 84%, transparent);
  }
  .hazard.l { left: 0; } .hazard.r { right: 0; }

  .marks {
    position: absolute; inset: 0; opacity: .055; overflow: hidden;
    display: flex; flex-wrap: wrap; align-content: flex-start; gap: 44px 76px;
    padding: 30px; transform: rotate(-8deg) scale(1.3); transform-origin: center;
  }
  .marks span { color: #fff; font-size: 42px; font-weight: 900; letter-spacing: 8px; white-space: nowrap; }

  .grain {
    position: absolute; inset: 0; opacity: .5;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px);
  }

  .banner {
    position: absolute; left: 0; right: 0; top: 0; height: 212px;
    background: linear-gradient(180deg, rgba(150,10,22,.58), rgba(12,6,8,0));
    border-bottom: 1px solid rgba(255,90,96,.2);
  }
  .kicker {
    position: absolute; left: 0; right: 0; top: 836px; text-align: center;
    color: rgba(255,190,195,.5); font-size: 15px; font-weight: 900;
    letter-spacing: 14px; text-transform: uppercase;
  }
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 200px;
    background: linear-gradient(0deg, rgba(8,4,6,.93), rgba(8,4,6,0));
  }

  /* frame drawn outside .art so it rings the hole */
  .win {
    position: absolute; left: 500px; top: 280px; width: 920px; height: 518px;
    border: 4px solid rgba(212,175,55,.9); border-radius: 8px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 26px 60px rgba(0,0,0,.6),
                inset 0 0 40px rgba(0,0,0,.5);
  }
  .bracket { position: absolute; width: 56px; height: 56px; border: 5px solid #ff5a60; }
  .bracket.tl { left: -5px;  top: -5px;    border-right: 0; border-bottom: 0; }
  .bracket.tr { right: -5px; top: -5px;    border-left: 0;  border-bottom: 0; }
  .bracket.bl { left: -5px;  bottom: -5px; border-right: 0; border-top: 0; }
  .bracket.br { right: -5px; bottom: -5px; border-left: 0;  border-top: 0; }

  /* thin accent rails top and bottom of the window */
  .rail { position: absolute; height: 3px; left: 500px; width: 920px;
    background: linear-gradient(90deg, transparent, rgba(255,90,96,.75), transparent); }
  .rail.t { top: 266px; } .rail.b { top: 806px; }
</style>
</head>
<body>
  <div class="art">
    <div class="base"></div>
    <div class="marks" id="marks"></div>
    <div class="wedge l"></div>
    <div class="wedge r"></div>
    <div class="hazard l"></div>
    <div class="hazard r"></div>
    <div class="banner"></div>
    <div class="kicker">Rivals WatchAlong &middot; hoping for the worst</div>
    <div class="foot"></div>
    <div class="grain"></div>
  </div>

  <div class="rail t"></div>
  <div class="rail b"></div>
  <div class="win">
    <div class="bracket tl"></div><div class="bracket tr"></div>
    <div class="bracket bl"></div><div class="bracket br"></div>
  </div>

<script>
  const words = ["HATE WATCH", "NOT OUR CLUB", "COME ON YOU EVERYONE ELSE", "RIVALS WATCHALONG"];
  let html = "";
  for (let i = 0; i < 60; i++) html += `<span>${words[i % words.length]}</span>`;
  document.getElementById("marks").innerHTML = html;
</script>
</body>
</html>
