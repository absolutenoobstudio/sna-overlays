<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }

  /* Landscape gameplay on a portrait canvas leaves ~650px dead at the top and
     bottom. Everything paintable lives in .art, masked so the 16:9 gameplay
     window is punched clean through - the game capture sits behind this page.
     An SVG mask masks by ALPHA, so the hole has to be a single even-odd path
     rather than a black rectangle. */
  .art {
    position: absolute; inset: 0;
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><path fill='white' fill-rule='evenodd' d='M0 0H1080V1920H0Z M0 660H1080V1268H0Z'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><path fill='white' fill-rule='evenodd' d='M0 0H1080V1920H0Z M0 660H1080V1268H0Z'/></svg>");
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }

  .base {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 620px at 50% 4%, rgba(93,160,255,.30), transparent 62%),
      radial-gradient(900px 620px at 50% 96%, rgba(60,120,220,.20), transparent 62%),
      linear-gradient(180deg, #0d182e 0%, #0a1426 48%, #070f1f 100%);
  }

  /* faint pitch-line texture so the empty areas are not flat */
  .grid {
    position: absolute; inset: 0; opacity: .5;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 2px, transparent 2px 84px),
      repeating-linear-gradient(0deg,  rgba(255,255,255,.022) 0 2px, transparent 2px 84px);
  }
  .grain { position: absolute; inset: 0; opacity: .45;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px); }

  /* angled accent wedges, top and bottom */
  .wedge {
    position: absolute; left: -60px; right: -60px; height: 280px; opacity: .38;
    background: linear-gradient(180deg, rgba(93,160,255,.55), rgba(20,60,130,0));
  }
  .wedge.t { top: 300px; clip-path: polygon(0 0, 100% 16%, 100% 100%, 0 84%); }
  .wedge.b { bottom: 300px; clip-path: polygon(0 16%, 100% 0, 100% 84%, 0 100%); }

  .stripes {
    position: absolute; left: 0; right: 0; height: 54px; opacity: .22;
    background: repeating-linear-gradient(135deg, #5da0ff 0 18px, transparent 18px 36px);
    -webkit-mask-image: linear-gradient(90deg, transparent, black 14%, black 86%, transparent);
    mask-image: linear-gradient(90deg, transparent, black 14%, black 86%, transparent);
  }
  .stripes.t { top: 236px; } .stripes.b { bottom: 236px; }

  /* ---------- top block ---------- */
  .brand {
    position: absolute; left: 0; right: 0; top: 96px; text-align: center;
  }
  .brand .mark {
    color: #fff; font-size: 74px; font-weight: 900; letter-spacing: 12px;
    text-shadow: 0 0 34px rgba(93,160,255,.6), 0 6px 18px rgba(0,0,0,.8);
  }
  .brand .mark span { color: #8fc4ff; }
  .brand .sub {
    margin-top: 12px; color: #8fa3c4; font-size: 21px; font-weight: 800;
    letter-spacing: 9px; text-transform: uppercase;
  }
  .game {
    position: absolute; left: 0; right: 0; top: 470px; text-align: center;
    color: #fff; font-size: 46px; font-weight: 900; letter-spacing: 7px;
  }
  .game b { color: #8fc4ff; }
  .game .pill {
    display: inline-block; margin-top: 16px; padding: 9px 30px;
    border: 2px solid rgba(93,160,255,.6); border-radius: 999px;
    color: #8fc4ff; font-size: 19px; font-weight: 900; letter-spacing: 6px;
  }

  /* ---------- bottom block ---------- */
  .foot {
    position: absolute; left: 0; right: 0; bottom: 0; height: 560px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  }
  .foot .cta {
    color: #fff; font-size: 40px; font-weight: 900; letter-spacing: 6px;
    text-shadow: 0 4px 16px rgba(0,0,0,.8);
  }
  .foot .cta b { color: #8fc4ff; }
  .foot .handles { display: flex; gap: 20px; }
  .foot .tag {
    padding: 12px 26px; border-radius: 12px;
    background: rgba(93,160,255,.12); border: 1px solid rgba(93,160,255,.4);
    color: #dce6f5; font-size: 23px; font-weight: 800; letter-spacing: 2px;
  }
  /* slow shimmer so the dead space is not static for a whole stream */
  .foot .cta { animation: pulse 4.5s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .68; } }

  /* ---------- the window frame, drawn OUTSIDE .art so it rings the hole ---- */
  .rail {
    position: absolute; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, transparent, #5da0ff, transparent);
    box-shadow: 0 0 22px rgba(93,160,255,.8);
  }
  .rail.t { top: 652px; } .rail.b { top: 1264px; }
  .corner { position: absolute; width: 56px; height: 56px; border: 5px solid #8fc4ff; }
  .corner.tl { left: 0;  top: 660px;     border-right: 0; border-bottom: 0; }
  .corner.tr { right: 0; top: 660px;     border-left: 0;  border-bottom: 0; }
  .corner.bl { left: 0;  top: 1212px;    border-right: 0; border-top: 0; }
  .corner.br { right: 0; top: 1212px;    border-left: 0;  border-top: 0; }
</style>
</head>
<body>
  <div class="art">
    <div class="base"></div>
    <div class="grid"></div>
    <div class="wedge t"></div>
    <div class="wedge b"></div>
    <div class="stripes t"></div>
    <div class="stripes b"></div>

    <div class="brand">
      <div class="mark">SNA <span>FOOTBALL</span></div>
      <div class="sub">Sam &amp; Noob</div>
    </div>
    <div class="game">
      EA <b>FC 27</b>
      <div class="pill">Live Gameplay</div>
    </div>

    <div class="foot">
      <div class="cta">FOLLOW FOR <b>MORE</b></div>
      <div class="handles">
        <span class="tag">YouTube &middot; SNA Football</span>
        <span class="tag">TikTok &middot; @snafootball</span>
      </div>
    </div>

    <div class="grain"></div>
  </div>

  <div class="rail t"></div>
  <div class="rail b"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
</body>
</html>
