<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }

  /* Portrait canvas, landscape gameplay in the middle. The blocks above and
     below are the whole design problem: left plain they read as dead black
     bars on a phone. So they are dense and always moving - drifting light,
     a flowing chevron pattern, rising embers, a shimmer through the club
     name and a marquee that never stops.

     Everything animates with transform or opacity only. This runs as a browser
     source for a whole stream, so nothing here animates a background or a
     filter, which would repaint every frame. */

  .art {
    position: absolute; inset: 0;
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><path fill='white' fill-rule='evenodd' d='M0 0H1080V1920H0Z M0 660H1080V1268H0Z'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><path fill='white' fill-rule='evenodd' d='M0 0H1080V1920H0Z M0 660H1080V1268H0Z'/></svg>");
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  }

  .base { position: absolute; inset: 0; background: linear-gradient(180deg, #0f0c07, #0a0805 45%, #050505); }

  /* drifting gold light, its own layer so it moves without repainting */
  .glow {
    position: absolute; width: 1500px; height: 1000px; left: 50%; margin-left: -750px;
    background: radial-gradient(closest-side, rgba(212,175,55,.34), transparent 70%);
    will-change: transform;
  }
  .glow.t { top: -360px; animation: driftT 24s ease-in-out infinite alternate; }
  .glow.b { bottom: -360px; animation: driftB 29s ease-in-out infinite alternate; }
  @keyframes driftT { from { transform: translate(-150px,-25px) scale(1); }   to { transform: translate(150px,45px) scale(1.16); } }
  @keyframes driftB { from { transform: translate(140px,35px) scale(1.12); }  to { transform: translate(-140px,-35px) scale(.95); } }

  /* huge repeated club watermark, slowly sliding */
  .marks {
    position: absolute; left: -10%; right: -10%; opacity: .032; overflow: hidden;
    display: flex; flex-wrap: wrap; gap: 26px 60px;
    transform: rotate(-7deg); will-change: transform;
  }
  .marks.t { top: -40px; height: 740px; animation: markDrift 40s linear infinite; }
  .marks.b { bottom: -40px; height: 740px; animation: markDrift 46s linear infinite reverse; }
  .marks span { color: #fff; font-size: 44px; font-weight: 900; letter-spacing: 8px; white-space: nowrap; }
  @keyframes markDrift { to { transform: rotate(-7deg) translateX(-240px); } }

  /* flowing chevrons - the main "this is alive" cue */
  .chev {
    position: absolute; left: -80px; right: -80px; height: 62px; opacity: .5;
    background: repeating-linear-gradient(115deg,
      rgba(212,175,55,.85) 0 10px, rgba(212,175,55,0) 10px 46px);
    -webkit-mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent);
    mask-image: linear-gradient(90deg, transparent, black 12%, black 88%, transparent);
    animation: chevFlow 2.6s linear infinite; will-change: transform;
  }
  /* 46px period on a 115deg gradient -> 50.8px along X for a seamless loop */
  @keyframes chevFlow { to { transform: translateX(50.8px); } }
  .chev.a { top: 322px; }
  .chev.b { top: 556px; animation-direction: reverse; opacity: .34; }
  .chev.c { top: 1310px; animation-direction: reverse; }
  .chev.d { top: 1840px; opacity: .34; }

  /* rising embers */
  .embers { position: absolute; left: 0; right: 0; height: 660px; overflow: hidden; }
  .embers.t { top: 0; } .embers.b { top: 1260px; height: 660px; }
  .ember {
    position: absolute; bottom: -20px; width: 6px; height: 6px; border-radius: 50%;
    background: #ffd75e; opacity: 0; will-change: transform, opacity;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(.6); opacity: 0; }
    12%  { opacity: .85; }
    80%  { opacity: .5; }
    100% { transform: translateY(-660px) scale(1.1); opacity: 0; }
  }

  .grain { position: absolute; inset: 0; opacity: .4;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 1px, transparent 1px 4px); }

  /* ---------------- top block ---------------- */
  .top { position: absolute; left: 0; right: 0; top: 34px; text-align: center; }
  .crest {
    width: 250px; height: 250px; display: block; margin: 0 auto 4px;
    filter: drop-shadow(0 0 26px rgba(212,175,55,.55));
    animation: crestFloat 5.5s ease-in-out infinite;
  }
  @keyframes crestFloat { 50% { transform: translateY(-9px); } }
  /* was small grey and sat in the glow - now white, larger, and readable */
  .chan {
    color: #fff; font-size: 38px; font-weight: 900; letter-spacing: 16px;
    text-transform: uppercase; text-shadow: 0 0 22px rgba(212,175,55,.65), 0 3px 12px rgba(0,0,0,.95);
  }
  .club {
    margin-top: 6px; font-size: 96px; font-weight: 900; letter-spacing: 4px;
    text-transform: uppercase; line-height: 1;
    background: linear-gradient(100deg, #b8892a 0%, #ffe9a3 28%, #ffd75e 42%, #b8892a 60%, #ffd75e 85%, #b8892a 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(212,175,55,.45));
    animation: shimmer 6s ease-in-out infinite;
  }
  @keyframes shimmer { 50% { background-position: 100% 0; } }

  .badges { margin-top: 88px; display: flex; gap: 18px; justify-content: center; }
  .badge {
    padding: 14px 32px; border-radius: 10px;
    background: rgba(212,175,55,.14); border: 2px solid rgba(212,175,55,.6);
    color: #fff; font-size: 33px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase;
  }
  .badge.alt { color: #ffd75e; }

  /* ---------------- bottom block ---------------- */
  .bot { position: absolute; left: 0; right: 0; top: 1318px; text-align: center; }
  /* the whole point of the stream: viewers joining the club. Loudest thing in
     the lower block, on a solid plate so it holds up on a phone. */
  .join {
    display: inline-block; padding: 20px 46px 24px; border-radius: 18px;
    background: linear-gradient(180deg, rgba(212,175,55,.20), rgba(212,175,55,.07));
    border: 3px solid rgba(255,215,94,.85);
    box-shadow: 0 0 40px rgba(212,175,55,.35), inset 0 0 30px rgba(0,0,0,.45);
    animation: joinPulse 3.4s ease-in-out infinite;
  }
  @keyframes joinPulse {
    50% { box-shadow: 0 0 62px rgba(212,175,55,.6), inset 0 0 30px rgba(0,0,0,.45); }
  }
  .join .lbl {
    color: #fff; font-size: 40px; font-weight: 900; letter-spacing: 11px;
    text-transform: uppercase; text-shadow: 0 3px 12px rgba(0,0,0,.9);
  }
  .join .who {
    margin-top: 6px; color: #ffd75e; font-size: 82px; font-weight: 900;
    letter-spacing: 3px; line-height: 1;
    text-shadow: 0 0 30px rgba(212,175,55,.65), 0 4px 16px rgba(0,0,0,.9);
  }
  .handles { margin-top: 30px; display: flex; gap: 20px; justify-content: center; }
  .tag {
    padding: 13px 26px; border-radius: 12px;
    background: rgba(212,175,55,.10); border: 1px solid rgba(212,175,55,.42);
    color: #e8dfd4; font-size: 25px; font-weight: 800; letter-spacing: 2px;
  }

  /* marquee - the thing that guarantees the bottom is never static */
  .ticker {
    position: absolute; left: 0; right: 0; top: 1690px; height: 76px;
    display: flex; align-items: center; overflow: hidden;
    border-top: 1px solid rgba(212,175,55,.3); border-bottom: 1px solid rgba(212,175,55,.3);
    background: rgba(212,175,55,.05);
  }
  .track { display: flex; white-space: nowrap; will-change: transform; animation: roll 26s linear infinite; }
  .track span { color: #ffd75e; font-size: 30px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; padding: 0 34px; }
  .track span i { color: #6f6250; font-style: normal; }
  @keyframes roll { to { transform: translateX(-50%); } }

  /* ---------------- window frame ---------------- */
  .rail {
    position: absolute; left: 0; right: 0; height: 4px; overflow: hidden;
    background: linear-gradient(90deg, transparent, #d4af37, transparent);
    box-shadow: 0 0 22px rgba(212,175,55,.75);
  }
  .rail.t { top: 652px; } .rail.b { top: 1264px; }
  .rail::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 240px;
    background: linear-gradient(90deg, transparent, #fff8dc, transparent);
    animation: sweep 6.5s ease-in-out infinite; will-change: transform;
  }
  .rail.b::after { animation-delay: 3.25s; animation-direction: reverse; }
  @keyframes sweep {
    0% { transform: translateX(-260px); opacity: 0; }
    12% { opacity: 1; } 88% { opacity: 1; }
    100% { transform: translateX(1080px); opacity: 0; }
  }
  .corner { position: absolute; width: 56px; height: 56px; border: 5px solid #ffd75e; animation: cpulse 3.2s ease-in-out infinite; }
  @keyframes cpulse { 50% { opacity: .5; box-shadow: 0 0 18px rgba(255,215,94,.55); } }
  .corner.tl { left: 0;  top: 660px;  border-right: 0; border-bottom: 0; }
  .corner.tr { right: 0; top: 660px;  border-left: 0;  border-bottom: 0; }
  .corner.bl { left: 0;  top: 1212px; border-right: 0; border-top: 0; }
  .corner.br { right: 0; top: 1212px; border-left: 0;  border-top: 0; }
</style>
</head>
<body>
  <div class="art">
    <div class="base"></div>
    <div class="glow t"></div>
    <div class="glow b"></div>
    <div class="marks t" id="marksT"></div>
    <div class="marks b" id="marksB"></div>
    <div class="chev a"></div><div class="chev b"></div>
    <div class="chev c"></div><div class="chev d"></div>
    <div class="embers t" id="emberT"></div>
    <div class="embers b" id="emberB"></div>

    <div class="top">
      <img class="crest" id="crest" src="sna-gaming-logo.png" alt="">
      <div class="chan" id="chan">SNA Football</div>
      <div class="club" id="club">NoobGamers</div>
      <div class="badges">
        <span class="badge" id="game">EA FC 27</span>
        <span class="badge alt" id="mode">Pro Clubs</span>
      </div>
    </div>

    <div class="bot">
      <div class="join">
        <div class="lbl" id="joinlbl">Join Club</div>
        <div class="who" id="joinwho">NoobGamers</div>
      </div>
      <div class="handles" id="handles">
        <span class="tag">YouTube &middot; SNA Football</span>
        <span class="tag">TikTok &middot; @snafootball</span>
      </div>
    </div>
    <div class="ticker"><div class="track" id="track"></div></div>

    <div class="grain"></div>
  </div>

  <div class="rail t"></div>
  <div class="rail b"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>

<script>
/* Wording is all editable from the address, because in TikTok LIVE Studio the
   address is the only thing you can change without opening the file:
     ?club=  ?chan=  ?game=  ?mode=      (empty value hides that element)
     ?cta=   *stars* mark words to pick out in gold
     ?tags=  pipe separated
     ?ticker= pipe separated marquee items                                  */
(function () {
  var Q = new URLSearchParams(location.search);
  var esc = function (t) { return String(t).replace(/[<>&]/g, function (c) {
    return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; }); };
  var gold = function (t) { return esc(t).replace(/\*([^*]+)\*/g, "<b>$1</b>"); };
  var set = function (id, key) {
    if (!Q.has(key)) return;
    var v = Q.get(key), el = document.getElementById(id);
    if (!el) return;
    if (!v) { el.style.display = "none"; return; }
    el.innerHTML = gold(v);
  };
  ["chan", "club", "game", "mode"].forEach(function (k) { set(k, k); });
  if (Q.has("nocrest")) document.getElementById("crest").style.display = "none";
  // the join plate: ?join= renames the club on it, ?joinlbl= changes the label
  set("joinwho", "join");
  set("joinlbl", "joinlbl");
  if (!Q.has("join") && Q.has("club")) {
    document.getElementById("joinwho").innerHTML = gold(Q.get("club"));
  }
  if (Q.has("tags")) {
    document.getElementById("handles").innerHTML = Q.get("tags").split("|").filter(Boolean)
      .map(function (t) { return '<span class="tag">' + gold(t) + "</span>"; }).join("");
  }

  var club = (Q.get("club") || "NoobGamers");

  // watermark: enough copies to cover the block at any size
  var words = [club, "EA FC", club, "PRO CLUBS"];
  var html = "";
  for (var i = 0; i < 54; i++) html += "<span>" + esc(words[i % words.length]) + "</span>";
  document.getElementById("marksT").innerHTML = html;
  document.getElementById("marksB").innerHTML = html;

  // embers, scattered so they do not pulse in unison
  ["emberT", "emberB"].forEach(function (id) {
    var box = document.getElementById(id), out = "";
    for (var i = 0; i < 16; i++) {
      var left = Math.round(Math.random() * 100);
      var dur = (9 + Math.random() * 9).toFixed(1);
      var delay = (-Math.random() * 18).toFixed(1);
      var size = (4 + Math.random() * 5).toFixed(1);
      out += '<span class="ember" style="left:' + left + '%;width:' + size + 'px;height:' + size +
             'px;animation-duration:' + dur + 's;animation-delay:' + delay + 's"></span>';
    }
    box.innerHTML = out;
  });

  // marquee, doubled so translateX(-50%) loops seamlessly
  var items = (Q.get("ticker") ||
    "Join Club: " + club + "|EA FC 27 Pro Clubs|Follow for more|YouTube: SNA Football|" +
    "TikTok: @snafootball|Join Club: " + club + "|Last Cards - out now"
  ).split("|").filter(Boolean);
  var one = items.map(function (t) { return "<span>" + esc(t) + " <i>&bull;</i></span>"; }).join("");
  document.getElementById("track").innerHTML = one + one;
})();
</script>
</body>
</html>
