<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: transparent; }
  body { font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }

  .panel {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(13, 24, 46,.90), rgba(7, 15, 31,.94));
    border: 1px solid rgba(93, 160, 255,.45); border-radius: 14px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    opacity: 0; transition: opacity .7s;
  }
  .panel.show { opacity: 1; }

  .head {
    flex: 0 0 auto; display: flex; align-items: baseline; justify-content: space-between;
    padding: 2.2% 5% 1.6%; border-bottom: 1px solid rgba(93, 160, 255,.28);
  }
  .head .t { color: #8fc4ff; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; }
  .head .s { color: #8fa3c4; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .head .s.on { color: #ff7b80; }
  .head .s.on::before {
    content: ""; display: inline-block; width: .62em; height: .62em; border-radius: 50%;
    background: #ff3b3b; margin-right: .5em; animation: blink 1.3s infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }

  .rows { flex: 1; display: flex; flex-direction: column; padding: 1.2% 3.5% 2%; min-height: 0; }
  .row { flex: 1 1 0; display: flex; align-items: center; gap: 2%; padding: 0 1.5%;
         border-radius: 5px; min-height: 0; }
  .row + .row { border-top: 1px solid rgba(255,255,255,.045); }
  .row.live { background: linear-gradient(90deg, rgba(239,1,7,.20), rgba(239,1,7,.02)); }

  /* a goal just went in - flash the row so it is impossible to miss */
  .row.goal { animation: goalflash 2.6s ease-out 1; }
  @keyframes goalflash {
    0%   { background: rgba(120,230,140,.55); }
    18%  { background: rgba(120,230,140,.40); }
    100% { background: rgba(239,1,7,.02); }
  }
  .row.goal .sc { animation: goalpop 2.6s ease-out 1; }
  @keyframes goalpop {
    0%, 12% { color: #8ef2a5; transform: scale(1.28); }
    100%    { color: #8fc4ff; transform: scale(1); }
  }

  .side { flex: 1; display: flex; align-items: center; gap: 6%; min-width: 0; }
  .side.a { justify-content: flex-end; }
  .side img { height: 58%; max-height: 24px; object-fit: contain; }
  .side .ab { color: #fff; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
  .sc { flex: 0 0 22%; text-align: center; color: #8fc4ff; font-weight: 900; white-space: nowrap;
        display: inline-block; }
  .st { flex: 0 0 20%; text-align: right; color: #8fa3c4; font-weight: 800; white-space: nowrap; }
  .st.on { color: #ff7b80; }
  .st.ht { color: #8fc4ff; }

  .msg { flex: 1; display: flex; align-items: center; justify-content: center;
         color: #8fa3c4; font-weight: 700; text-align: center; padding: 6%; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="head"><span class="t">Elsewhere</span><span class="s" id="sub">Live scores</span></div>
    <div class="rows" id="rows"><div class="msg">Loading…</div></div>
  </div>

<script>
const Q = new URLSearchParams(location.search);
const MAX = parseInt(Q.get("max") || "10", 10);
const RIVALS = ["360", "364", "363", "382", "367"];   // big six minus Arsenal
const FOLLOW = Q.get("follow") || "359";              // whose competition to show (359 = Arsenal)
const RIVAL_MODE = Q.has("rival");                    // or: whichever big-six rival is on
const FORCE_LEAGUE = Q.get("league");                 // or: pin one competition
// Every competition the followed team could turn up in. We only ever DISPLAY
// one of these - whichever they are actually in right now.
const LEAGUES = (Q.get("search") || "eng.1,uefa.champions,uefa.europa,eng.fa,eng.league_cup")
                  .split(",").filter(Boolean);

async function jget(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]));

function autoSize(count) {
  const h = window.innerHeight, w = window.innerWidth;
  const rowH = (h * 0.80) / Math.max(count, 1);
  const base = Math.max(9, Math.min(rowH * 0.44, w * 0.042));
  document.querySelectorAll(".row").forEach(r => { r.style.fontSize = base + "px"; });
  document.querySelector(".head .t").style.fontSize = Math.max(10, Math.min(h * 0.055, w * 0.05)) + "px";
  $("sub").style.fontSize = Math.max(8, Math.min(h * 0.032, w * 0.03)) + "px";
}

/* Remember each match's score so we can tell when one CHANGES. Polling alone
   only tells you the score, never that a goal just went in - and a goal you
   don't notice is the whole point of a live scores panel. */
const lastScore = new Map();      // eventId -> "2-1"
const flashing = new Set();       // eventIds mid-flash, so a re-render keeps it

function statusOf(ev) {
  const t = ev.status?.type, state = t?.state;
  if (state === "pre") {
    return { txt: new Date(ev.date).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), cls: "" };
  }
  if (state === "post") return { txt: "FT", cls: "" };
  // Half-time is a live state with the clock parked on 45. Match the STATUS
  // name, not the word "half" - ESPN's description reads "First Half" and
  // "Second Half" during normal play, which a /half/ test also matched, so
  // every live game showed HT instead of its clock.
  if (t?.name === "STATUS_HALFTIME" || /^half[- ]?time$/i.test(t?.description || "")) {
    return { txt: "HT", cls: "ht" };
  }
  return { txt: ev.status?.displayClock || "LIVE", cls: "on" };
}

function eventRow(ev) {
  const c = ev.competitions?.[0]?.competitors ?? [];
  const home = c.find(x => x.homeAway === "home") || c[0];
  const away = c.find(x => x.homeAway === "away") || c[1];
  const state = ev.status?.type?.state;
  const live = state === "in";
  const pair = `${home?.score ?? 0}-${away?.score ?? 0}`;
  const score = state === "pre" ? "v" : `${home?.score ?? 0} - ${away?.score ?? 0}`;
  const s = statusOf(ev);

  // did the score move since the last poll?
  const prev = lastScore.get(ev.id);
  if (state !== "pre") {
    if (prev !== undefined && prev !== pair) flashing.add(ev.id);
    lastScore.set(ev.id, pair);
  }
  const goal = flashing.has(ev.id);

  return `<div class="row ${live ? "live" : ""} ${goal ? "goal" : ""}" data-id="${esc(ev.id)}">
    <div class="side"><img src="${esc(home?.team?.logo || "")}" alt=""><span class="ab">${esc(home?.team?.abbreviation || "")}</span></div>
    <div class="sc">${esc(score)}</div>
    <div class="side a"><span class="ab">${esc(away?.team?.abbreviation || "")}</span><img src="${esc(away?.team?.logo || "")}" alt=""></div>
    <div class="st ${live ? s.cls || "on" : ""}">${esc(s.txt)}</div>
  </div>`;
}

// FLIP, same as the league table: a match kicking off jumps to the top of the
// list, and you should see it travel there rather than teleport.
function capturePositions() {
  const m = new Map();
  document.querySelectorAll(".row[data-id]").forEach(el => m.set(el.dataset.id, el.getBoundingClientRect().top));
  return m;
}
function playMoves(before) {
  document.querySelectorAll(".row[data-id]").forEach(el => {
    const was = before.get(el.dataset.id);
    if (was === undefined) {
      if (before.size) {
        el.style.transition = "none"; el.style.opacity = "0";
        requestAnimationFrame(() => { el.style.transition = "opacity .6s"; el.style.opacity = ""; });
      }
      return;
    }
    const dy = was - el.getBoundingClientRect().top;
    if (!dy) return;
    el.style.transition = "none";
    el.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(() => {
      el.style.transition = "transform .9s cubic-bezier(.2,.9,.25,1)";
      el.style.transform = "";
    });
  });
}

/* Which competition is the followed team in RIGHT NOW? Their own fixture
   decides it, so a Champions League night shows the other European ties rather
   than a league nobody asked about. Live beats upcoming beats just-finished. */
function whoWeFollow(ev) {
  const ids = (ev.competitions?.[0]?.competitors ?? []).map(c => String(c.team?.id));
  return RIVAL_MODE ? ids.some(i => RIVALS.includes(i)) : ids.includes(FOLLOW);
}

async function pickCompetition(feeds) {
  if (FORCE_LEAGUE) return { lg: FORCE_LEAGUE, ourMatch: null };
  const now = Date.now(), FRESH = 36 * 3600 * 1000;
  const cands = [];
  for (const { lg, j } of feeds) {
    for (const ev of (j?.events ?? [])) {
      if (!whoWeFollow(ev)) continue;
      const st = ev.status?.type?.state;
      const age = now - new Date(ev.date).getTime();
      if (st === "post" && age > FRESH) continue;      // stale cup tie
      cands.push({ lg, ev, rank: st === "in" ? 0 : st === "pre" ? 1 : 2, t: new Date(ev.date).getTime() });
    }
  }
  if (!cands.length) return { lg: null, ourMatch: null };
  cands.sort((a, b) => a.rank - b.rank || (a.rank === 2 ? b.t - a.t : a.t - b.t));
  return { lg: cands[0].lg, ourMatch: cands[0].ev };
}

async function render() {
  // one round trip per competition, all at once
  const feeds = await Promise.all(LEAGUES.map(async lg => {
    try { return { lg, j: await jget(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lg}/scoreboard`) }; }
    catch (e) { return { lg, j: null }; }
  }));

  const { lg: COMP, ourMatch } = await pickCompetition(feeds);
  const feed = feeds.find(f => f.lg === COMP);
  const compName = feed?.j?.leagues?.[0]?.abbreviation
                || feed?.j?.leagues?.[0]?.name || "";

  const all = [];
  if (feed) {
    for (const ev of (feed.j?.events ?? [])) {
      // leave out the match being watched - it is already in the scorebug
      if (ourMatch && ev.id === ourMatch.id) continue;
      if (!ourMatch && whoWeFollow(ev)) continue;
      all.push({ ev, lgOrder: 0 });
    }
  }

  const rank = e => e.ev.status?.type?.state === "in" ? 0 : e.ev.status?.type?.state === "pre" ? 1 : 2;
  all.sort((a, b) => rank(a) - rank(b) || new Date(a.ev.date) - new Date(b.ev.date));

  const shown = all.slice(0, MAX);
  const liveCount = all.filter(e => rank(e) === 0).length;
  // name the competition in the header so it is obvious what you are looking at
  document.querySelector(".head .t").textContent = compName || "Elsewhere";

  const before = capturePositions();
  $("rows").innerHTML = shown.length
    ? shown.map(e => eventRow(e.ev)).join("")
    : `<div class="msg">${COMP ? "No other fixtures in this round." : "Nothing on right now."}</div>`;
  autoSize(shown.length || 1);
  playMoves(before);

  // let each flash play once, then clear it so the next poll does not repeat it
  if (flashing.size) setTimeout(() => flashing.clear(), 2600);

  $("sub").textContent = liveCount ? `${liveCount} live` : "Today";
  $("sub").classList.toggle("on", liveCount > 0);
  $("panel").classList.add("show");

  clearTimeout(render._t);
  render._t = setTimeout(render, liveCount ? 20000 : 60000);
}

render();
addEventListener("resize", () => autoSize(document.querySelectorAll(".row").length));
</script>
</body>
</html>
