<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --accent1: #7c5cff;
    --accent2: #22d3ee;
    --bg: #0b0e1a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: var(--bg);
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .bg {
    position: absolute; inset: -20%;
    background:
      radial-gradient(850px 650px at 85% 12%, rgba(34, 211, 238, .28), transparent 65%),
      radial-gradient(800px 650px at 12% 88%, rgba(124, 92, 255, .32), transparent 65%),
      #0b0e1a;
    animation: sway 22s ease-in-out infinite alternate;
  }
  @keyframes sway {
    from { transform: translate(0,0) scale(1); }
    to   { transform: translate(60px, -40px) scale(1.06); }
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .stack { position: relative; text-align: center; z-index: 2; }
  h1 {
    font-size: 140px; font-weight: 800; letter-spacing: 6px; text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent1));
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 300% 0; } }
  .sub {
    margin-top: 30px; color: #9aa3c0; font-size: 36px; font-weight: 500; letter-spacing: 2px;
  }
  .handle {
    position: absolute; bottom: 70px; left: 0; right: 0; text-align: center;
    color: #c7cdea; font-size: 34px; font-weight: 600; letter-spacing: 3px; z-index: 2;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="vignette"></div>
  <div class="stack">
    <h1>Be Right Back</h1>
    <div class="sub">hang tight — back in a moment</div>
  </div>
  <div class="handle">@AbsoluteNoob</div>
</body>
</html>
